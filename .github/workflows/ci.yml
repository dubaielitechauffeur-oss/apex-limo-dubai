name: "✅ CI — Typecheck, Lint, Test, Build"

# Runs on every PR and on pushes to main. Nothing gated the application before
# this: the only workflows in the repo were the three SEO-agent jobs, so a PR
# that failed to compile could be merged and auto-deployed to Vercel, and the
# 32 Vitest suites were never executed by anything.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Typecheck · Lint · Test · Build"
    runs-on: ubuntu-latest

    services:
      # The integration suites talk to a real Postgres by design (see
      # vitest.config.mts) — mocking Prisma would stop them testing the thing
      # they exist to test. A service container gives CI the same shape a
      # developer has locally.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_limo_dubai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex_limo_dubai?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex_shadow?schema=public
      # Auth.js refuses to boot without a secret. A throwaway value is correct
      # here — CI never issues a session anyone can use.
      AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` requires package-lock.json to be in sync with package.json.
      # It was not, which meant a clean install failed outright — fixed by
      # regenerating the lockfile. Keeping `ci` (not `install`) here is what
      # makes that stay true.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Guards against schema drift: `schema.prisma` once declared three
      # columns that no migration created, so a database built purely from the
      # migration history was missing them and every vehicle write failed.
      # --exit-code makes a non-empty diff fail the build.
      - name: Verify migrations match schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Seed reference data
        run: npx prisma db seed

      - name: Test
        run: npx vitest run

      - name: Production build
        run: npm run build
