name: "🗄️ Migrate production database"

# Applies pending Prisma migrations to the production database when a schema
# change lands on main.
#
# Why this exists: nothing applied migrations outside CI's throwaway database.
# Merging a schema change shipped code whose queries named columns production
# did not have, and because Prisma selects every column of a model, the damage
# was not limited to the new feature — the admin Services screen errored on
# load and the public service pages fell through to their static fallback,
# hiding every CMS edit. Neither CI nor the build caught it: CI migrates its
# own database first.
#
# Why here rather than in `npm run build`: Vercel builds preview deployments
# too, so a migration in the build command would let any PR's preview reshape
# the production schema before its code was reviewed. Running on main only
# keeps that to merges.
#
# Activation: add a `DATABASE_URL` repository secret pointing at production
# (Settings → Secrets and variables → Actions). Until then this job skips
# itself with a notice rather than failing, so merging it changes nothing.

on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
  # Also runnable by hand, e.g. to repair a database that drifted before this
  # workflow existed.
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: "Apply pending migrations"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::notice::No DATABASE_URL secret is set, so there is nothing to migrate against."
            echo "::notice::Add one under Settings → Secrets and variables → Actions to enable this job."
            exit 0
          fi

          # Deploy first, and only reach for a baseline if Prisma itself
          # asks for one. This database predates the migration workflow: it
          # was built with `prisma db push`, so the schema exists but there is
          # no `_prisma_migrations` table, and deploy refuses with P3005
          # ("The database schema is not empty"). Prisma's documented answer
          # is to record the migrations whose changes the database already has,
          # then deploy what is genuinely new.
          #
          # Keying off the real error rather than a guess matters: any other
          # failure still fails the job instead of being baselined over.
          if npx prisma migrate deploy 2>&1 | tee /tmp/deploy.log; then
            exit 0
          fi

          if ! grep -q "P3005" /tmp/deploy.log; then
            echo "::error::migrate deploy failed for a reason other than a missing baseline."
            exit 1
          fi

          newest=$(ls -1 prisma/migrations | grep -v migration_lock | sort | tail -1)
          echo "No migration history in this database — baselining everything before $newest."
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            if [ "$name" = "$newest" ]; then continue; fi
            echo "  marking $name as already applied"
            npx prisma migrate resolve --applied "$name"
          done

          npx prisma migrate deploy

      # A baseline that guessed wrong would leave the database quietly out of
      # step with the schema, which is the failure mode this workflow exists
      # to prevent. `migrate status` reporting every migration applied is the
      # proof it did not. (`migrate diff --to-migrations` would compare more
      # deeply but needs a shadow database, which this job has no business
      # creating next to production.)
      - name: Verify every migration is recorded as applied
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then exit 0; fi
          npx prisma migrate status | tee /tmp/status.log
          grep -q "Database schema is up to date" /tmp/status.log
